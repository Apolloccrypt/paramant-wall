# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=proxy:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=snippet:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

server {
    # Performance
    keepalive_timeout 65;
    keepalive_requests 1000;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;
    # Security
    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    # Limit connections
    limit_conn connlimit 20;

    listen 80;
    server_name wall.paramant.app;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    include /etc/nginx/cloudflare-ips.conf;
    server_name wall.paramant.app;
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Cloudflare Authenticated Origin Pulls (mTLS)
    ssl_client_certificate /etc/ssl/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # ZERO LOGGING
    access_log off;
    error_log /dev/null crit;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    root /opt/wall/public;
    index index.html;

    location ~* ^/feed/[a-f0-9]+ {
        try_files /feed.html =404;
        access_log off;
    }
    location /snippet.js {
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }
    location = /api/stripe/webhook {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        access_log off;
    }
    location ~ ^/(api|proxy|health|stats|feed|webhook|success|cancel|privacy|recover) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_read_timeout 10s;
        access_log off;
    }
    # Blokkeer gevoelige bestanden
    location ~* \.(js|json|env|log|sh|key|pem|crt|sql|bak)$ {
        location ~* ^/(snippet\.js|trackers\.js)$ {
            add_header Cache-Control "public, max-age=7200, s-maxage=7200";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
        access_log off;
    }
}